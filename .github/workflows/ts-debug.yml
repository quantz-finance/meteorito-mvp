name: TS-DEBUG (temporal, se borra antes del merge)
on:
  push:
    branches: [sec/8-turnstile]
permissions:
  contents: read
jobs:
  ts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    env:
      CI: 'true'
      TESTNET: skip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/e2e/build-mock.mjs
      - run: npm run -s demo:build
      - name: TS-01 webkit
        run: TS_DEBUG=1 npx playwright test --project=mock-iphone-se --no-deps e2e/mock-guest.spec.ts -g "TS-01" --retries=0 --timeout=120000 --trace=on --reporter=list
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ts-debug-results
          path: test-results/
          retention-days: 3
