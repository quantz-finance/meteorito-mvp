name: E2E
# Playwright contra el build web en modo demo y el build real con API simulado (sin Cavos, sin backend, sin testnet, sin secretos).
# Mismos tests que `npm run test:e2e`, repartidos en 4 shards en paralelo (--shard). El job final `e2e` junta los
# reportes y es el único check a mirar/requerir: falla si cualquier shard falla.
on:
  push:
    branches: [main]
  pull_request:

# PRs: un push nuevo cancela la corrida anterior del mismo PR. main: cada commit corre completo (grupo único por run).
concurrency:
  group: e2e-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CI: 'true'
  TESTNET: skip
  SHARDS: 4

jobs:
  shard:
    name: e2e-shard (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # node_modules completo (ya con el postinstall aplicado): con hit se salta `npm ci`.
      - name: Cache node_modules
        id: nm
        uses: actions/cache@v4
        with:
          path: node_modules
          key: nm-${{ runner.os }}-node22-${{ hashFiles('package-lock.json', 'scripts/patch-cavos-kit.mjs') }}
      - if: steps.nm.outputs.cache-hit != 'true'
        run: npm ci

      # Los dos builds web (demo y real con API simulado) corren en segundo plano, en paralelo entre sí y con la
      # instalación de navegadores. TMPDIR separado = caché de Metro separada (ambos usan --clear).
      - name: Builds web en segundo plano (dist-demo + dist-e2e)
        run: |
          mkdir -p /tmp/metro-demo /tmp/metro-mock /tmp/builds
          ( TMPDIR=/tmp/metro-demo npm run -s demo:build > /tmp/builds/demo.log 2>&1; echo $? > /tmp/builds/demo.exit ) &
          ( TMPDIR=/tmp/metro-mock node scripts/e2e/build-mock.mjs > /tmp/builds/mock.log 2>&1; echo $? > /tmp/builds/mock.exit ) &

      - name: Versión de Playwright
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache navegadores Playwright
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-chromium-webkit
      # Solo los navegadores que usan los proyectos (WebKit para iPhone, Chromium para Pixel 7).
      - name: Navegadores (WebKit + Chromium), sin caché
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps webkit chromium
      - name: Dependencias del sistema (navegadores en caché)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps webkit chromium

      - name: Esperar builds
        timeout-minutes: 8
        run: |
          for b in demo mock; do
            while [ ! -f /tmp/builds/$b.exit ]; do sleep 2; done
            echo "::group::build $b (exit $(cat /tmp/builds/$b.exit))"; tail -n 40 /tmp/builds/$b.log; echo "::endgroup::"
          done
          [ "$(cat /tmp/builds/demo.exit)" = 0 ] && [ "$(cat /tmp/builds/mock.exit)" = 0 ]

      - name: E2E shard ${{ matrix.shard }}/4 (API + iPhone SE + iPhone 13 + Chromium + build real con API simulado)
        run: npx playwright test --shard=${{ matrix.shard }}/${{ env.SHARDS }} --reporter=list,blob

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: |
            test-results/
            /tmp/builds/*.log
          retention-days: 7

  # Check único y estable: se llama `e2e` como antes (branch protection / costumbre).
  e2e:
    name: e2e
    if: ${{ always() }}
    needs: [shard]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cache node_modules
        id: nm
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: nm-${{ runner.os }}-node22-${{ hashFiles('package-lock.json', 'scripts/patch-cavos-kit.mjs') }}
      - if: steps.nm.outputs.cache-hit != 'true'
        run: npm ci
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true
      - name: Reporte unificado (HTML)
        continue-on-error: true
        run: npx playwright merge-reports --reporter=html,list ./all-blob-reports
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        continue-on-error: true
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
      - name: Resultado
        run: |
          echo "shards: ${{ needs.shard.result }}"
          [ "${{ needs.shard.result }}" = success ]
