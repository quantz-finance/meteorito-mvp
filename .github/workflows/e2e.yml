name: E2E
# Playwright contra el build web en modo demo y el build real con API simulado (sin Cavos, sin backend, sin testnet, sin secretos).
# Mismos tests que `npm run test:e2e` (todos los proyectos de playwright.config.ts):
#   build (demo | mock, en paralelo, una sola vez) -> 6 shards en paralelo (--shard) -> job final `e2e`.
# El job final `e2e` junta los reportes y es el único check a mirar/requerir: falla si falla cualquier job previo.
#
# Navegadores: los shards corren dentro de la imagen oficial de Playwright (misma versión que package-lock.json), que
# ya trae WebKit + Chromium y todas sus dependencias del sistema. Así no se ejecuta `playwright install --with-deps`,
# cuyo apt-get (update + ~180 paquetes de WebKit) tardaba de 2 a más de 15 min y a veces agotaba el timeout.
on:
  push:
    branches: [main]
  pull_request:

# PRs: un push nuevo cancela la corrida anterior del mismo PR. main: cada commit corre completo (grupo único por run).
concurrency:
  group: e2e-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CI: 'true'
  TESTNET: skip

jobs:
  # Versión exacta de @playwright/test según el lockfile -> tag de la imagen de Playwright.
  prep:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      pw: ${{ steps.v.outputs.pw }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: package-lock.json
          sparse-checkout-cone-mode: false
      - id: v
        run: echo "pw=$(jq -r '.packages["node_modules/@playwright/test"].version' package-lock.json)" >> "$GITHUB_OUTPUT"

  # Los dos builds web una sola vez, cada uno en su runner (en el mismo runner compiten por CPU: ~170 s c/u vs ~85 s).
  build:
    name: e2e-build (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: demo
            cmd: npm run -s demo:build
            out: dist-demo
          - target: mock
            cmd: node scripts/e2e/build-mock.mjs
            out: dist-e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Cache node_modules
        id: nm
        uses: actions/cache@v4
        with:
          path: node_modules
          key: nm-host-node22-${{ hashFiles('package-lock.json', 'scripts/patch-cavos-kit.mjs') }}
      - if: steps.nm.outputs.cache-hit != 'true'
        run: npm ci
      - name: Build ${{ matrix.out }}
        run: ${{ matrix.cmd }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.out }}
          path: ${{ matrix.out }}/
          include-hidden-files: true
          retention-days: 1

  shard:
    name: e2e-shard (${{ matrix.shard }}/6)
    needs: [prep, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.prep.outputs.pw }}-noble
      options: --ipc=host
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # node_modules completo (ya con el postinstall aplicado): con hit se salta `npm ci`.
      - name: Cache node_modules
        id: nm
        uses: actions/cache@v4
        with:
          path: node_modules
          key: nm-pwcontainer-${{ needs.prep.outputs.pw }}-node22-${{ hashFiles('package-lock.json', 'scripts/patch-cavos-kit.mjs') }}
      - if: steps.nm.outputs.cache-hit != 'true'
        run: npm ci

      - uses: actions/download-artifact@v4
        with:
          name: dist-demo
          path: dist-demo
      - uses: actions/download-artifact@v4
        with:
          name: dist-e2e
          path: dist-e2e

      - name: E2E shard ${{ matrix.shard }}/6 (API + iPhone SE + iPhone 13 + Chromium + build real con API simulado)
        run: npx playwright test --shard=${{ matrix.shard }}/6 --reporter=list,blob

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results-shard-${{ matrix.shard }}
          path: test-results/
          retention-days: 7

  # Check único y estable: se llama `e2e` como antes (branch protection / costumbre).
  e2e:
    name: e2e
    if: ${{ always() }}
    needs: [prep, build, shard]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        if: ${{ needs.prep.outputs.pw != '' }}
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true
      - name: Reporte unificado (HTML)
        if: ${{ needs.prep.outputs.pw != '' }}
        continue-on-error: true
        run: npx -y -p @playwright/test@${{ needs.prep.outputs.pw }} playwright merge-reports --reporter=html,list ./all-blob-reports
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        continue-on-error: true
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
      - name: Resultado
        run: |
          echo "prep: ${{ needs.prep.result }} · build: ${{ needs.build.result }} · shards: ${{ needs.shard.result }}"
          [ "${{ needs.prep.result }}" = success ] && [ "${{ needs.build.result }}" = success ] && [ "${{ needs.shard.result }}" = success ]
