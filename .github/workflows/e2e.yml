name: E2E
# Playwright contra el build web en modo demo y el build real con API simulado (sin Cavos, sin backend, sin testnet, sin secretos).
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      TESTNET: skip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Navegadores (WebKit + Chromium)
        run: npx playwright install --with-deps webkit chromium
      - name: E2E (API + iPhone SE + iPhone 13 + Chromium + build real con API simulado)
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
