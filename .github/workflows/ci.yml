name: CI
on:
  # Solo main + PRs: un push a una rama con PR abierto disparaba el job dos veces (~9 USDC de treasury por corrida).
  push:
    branches: [main]
  pull_request:

# Un solo run on-chain a la vez (comparten wallets de testnet): solo los PRs entran en ci-testnet.
# main (push) corre sin red (TESTNET=skip: los tests on-chain ya pasaron en el PR que se mergeó) y en su propio grupo por
# commit: un PR en cola ya no lo desplaza ("cancelled" sin correr) y el deploy de main no queda en "Waiting for checks".
# PRs sin secretos (Dependabot o forks) nunca tocan testnet: van en su propio grupo por PR (un push nuevo cancela el
# anterior) y no entran en ci-testnet, así no desplazan ni cancelan los runs on-chain de los PRs normales.
concurrency:
  group: ${{ github.event_name == 'push' && format('ci-main-{0}', github.sha) || ((github.event.pull_request.user.login == 'dependabot[bot]' || github.event.pull_request.head.repo.full_name != github.repository) && format('ci-nosecrets-{0}', github.event.pull_request.number) || 'ci-testnet') }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && (github.event.pull_request.user.login == 'dependabot[bot]' || github.event.pull_request.head.repo.full_name != github.repository) }}

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: 'true'
      STELLAR_NETWORK: testnet   # SOLO testnet; el backend rechaza cualquier otra red
      # PRs desde forks no reciben secretos: se corren solo los tests unitarios.
      # main (push) tampoco: corre unit + typecheck + export, sin tocar las wallets de testnet que usan los PRs.
      # Dependabot tampoco recibe los secretos de Actions: sin esto su PR fallaría con "Faltan secretos testnet".
      # Se mira el autor del PR (no github.actor): un re-run hecho por una persona sobre un PR de Dependabot tampoco gasta treasury.
      TESTNET: ${{ (github.event_name == 'push' || github.event.pull_request.user.login == 'dependabot[bot]' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)) && 'skip' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck (app + api)
        run: npm run typecheck
      - name: Expo web export
        run: npx expo export -p web
      - name: API carga como CommonJS sin require(esm) (evita ERR_REQUIRE_ESM)
        run: npm run check:cjs
      - name: Tests (unit + testnet)
        run: npm run test:ci
        env:
          TW_API_KEY: ${{ secrets.TW_API_KEY }}
          TESTNET_DEPLOYER_SECRET: ${{ secrets.TESTNET_DEPLOYER_SECRET }}
          TESTNET_TREASURY_SECRET: ${{ secrets.TESTNET_TREASURY_SECRET }}
          TESTNET_APPROVER_SECRET: ${{ secrets.TESTNET_APPROVER_SECRET }}
          TESTNET_RELEASE_SIGNER_SECRET: ${{ secrets.TESTNET_RELEASE_SIGNER_SECRET }}
          TESTNET_PLATFORM_SECRET: ${{ secrets.TESTNET_PLATFORM_SECRET }}
          TESTNET_DISPUTE_RESOLVER_SECRET: ${{ secrets.TESTNET_DISPUTE_RESOLVER_SECRET }}
          TESTNET_SELLER_SECRET: ${{ secrets.TESTNET_SELLER_SECRET }}
          TESTNET_BUYER_SECRET: ${{ secrets.TESTNET_BUYER_SECRET }}
